    <h1 style="display: flex;text-align: center;justify-content: center">Event delegation - Periodic table</h1>
    <section class="mainbody" style="display: flex;text-align: center;justify-content: space-between"></section>
    <script>
        const createPeriodicElement=(Symbol,atomicNo,name)=>{
            const element=document.createElement("div");
            element.classList.add("element");
            element.innerHTML=Symbol;
            element.setAttribute("data-atomic-number",atomicNo)
            element.setAttribute("data-atomic-name",name)
            return element;
        }

        const handleElementClick=(event)=>{
            const target=event.target
            if(target.classList.contains("element")){
                const AtomicNo=target.getAttribute("data-atomic-number")
                const AtomicName=target.getAttribute("data-atomic-name")
                alert(`Atomic number : ${AtomicNo}\nAtomic name : ${AtomicName}`)
            }
        }

        function initializedPeriodicTable(){
            const mainbody=document.querySelector(".mainbody")
            for(let i=1;i<=50;i++){
                const element=createPeriodicElement(`Elem${i}`,i,`Element${i}`)
                mainbody.append(element)
            }
            mainbody.addEventListener("click",handleElementClick)
        }

        initializedPeriodicTable();

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <h1>Welcome to Dad jokes!
        </h1>
        <section class="api_body"></section>
        <button id="fetchjoke">get another joke</button>
    </div>
    <script>
        const apiBody = document.querySelector(".api_body")
        const apiUrl = "https://icanhazdadjoke.com/"

        async function getJoke(){
            try{
            const res=await fetch(apiUrl,{
                headers:{
                    Accept:"application/json"
                }
            })
            const data=await res.json()
            console.log(data.joke)
            apiBody.innerHTML=data.joke
        }catch(error){
            apiBody.innerHTML=`API is not working`
            console.log(error)
        }
        }
        getJoke()
        document.getElementById("fetchjoke").addEventListener("click",getJoke)

    </script>
</body>

</html>

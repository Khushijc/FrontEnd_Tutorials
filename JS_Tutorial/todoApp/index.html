<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>
        <h1>todo List</h1>
        <input type="text" id="inputField">
        <button class="btn">click me</button>
        <div class="todoListener">
        </div>
    </div>
    <script>
        let inputElement = document.getElementById("inputField");
        console.log(inputElement);
        let clickbtn = document.querySelector(".btn");
        console.log(clickbtn)
        let todofirst = document.querySelector(".todoListener")
        let localTodo = []
        const todoList = inputElement.value.trim();
        localTodo.push(todoList)
        localTodo = [new Set(localTodo)]
        console.log(localTodo)
        localStorage.setItem("TODO",JSON.stringify(localTodo))
        const addTodo = () => {
            console.log(inputElement.value)
            // todofirst.textContent=inputElement.value
            let pEle = document.createElement("p");
            pEle.textContent = inputElement.value
            console.log(pEle)
            todofirst.append(pEle)
            inputElement.value = ""

        }
        clickbtn.addEventListener("click", () => {
            addTodo();
        })
        todofirst.addEventListener("click", (event) => {
            let currElement = (event.target)
            currElement.remove()
        })
    </script>
</body>

</html>
